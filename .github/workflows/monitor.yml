name: "Freelancer Monitor (Projects + Contests)"

on:
  schedule:
    # Runs every 5 minutes — each run internally loops for 5 min with 30s checks
    - cron: "*/5 * * * *"
  workflow_dispatch:   # Allow manual trigger

permissions:
  contents: write     # Needed to commit state file back

jobs:
  monitor:
    name: "Monitor Projects & Contests"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Freelancer Monitor
        env:
          GROQ_API_KEYS:       ${{ secrets.GROQ_API_KEYS }}
          FREELANCER_RSS_URL:  ${{ secrets.FREELANCER_RSS_URL }}
          SENDER_EMAIL:        ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL:      ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py

      - name: Persist state file
        run: |
          git config user.name "Freelancer Monitor Bot"
          git config user.email "bot@github-actions"
          git add seen_ids.json || true
          git diff --cached --quiet || git commit -m "Update seen_ids.json [skip ci]"
          git push || echo "Nothing to push"
