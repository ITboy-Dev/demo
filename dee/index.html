<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NJ Portable Storage</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#ffffff;
}

/* HEADER */

header{
width:100%;
padding:20px 60px;
background:#ffffff;
border-bottom:1px solid #eaeaea;
}

/* MAIN CONTAINER */

.header-container{
max-width:1400px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

/* LOGO */

.logo{
display:flex;
align-items:center;
}

.logo img{
height:110px;
width:auto;
display:block;
}

/* NAVIGATION */

nav{
display:flex;
align-items:center;
gap:45px;
}

nav a{
text-decoration:none;
font-size:17px;
color:#0e2c3f;
font-weight:500;
transition:0.3s;
}

nav a:hover{
color:#f47c34;
}

/* CONTACT BUTTON */

.contact-btn{
padding:14px 28px;
background:#0d3c54;
color:#fff;
border-radius:35px;
text-decoration:none;
font-weight:600;
font-size:16px;
transition:0.3s;
}

.contact-btn:hover{
background:#0a2f43;
}

/* MOBILE */

@media (max-width:900px){

header{
padding:10px 60px;
}

.header-container{
flex-direction:column;
gap:20px;
}

nav{
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.logo img{
height:60px;
}

}

</style>

</head>

<body>

<header>

<div class="header-container">

<!-- LOGO -->
<div class="logo">
<img src="clint_logo.png" alt="NJ Portable Storage">
</div>

<!-- NAVIGATION -->
<nav>

<a href="#">Get Quote</a>
<a href="#">How It Works</a>
<a href="#">Container Info</a>

<a href="#" class="contact-btn">Contact Us →</a>

</nav>

</div>

</header>

</body>
</html>
